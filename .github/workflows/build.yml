# Step 6: CI 自动构建（GitHub Actions）
# 行为: push / PR 触发 → Ubuntu 装 ARM 工具链 → cmake 配置(PATH 工具链) → 构建 → 上传 elf 产物
# 注意: TOOLCHAIN_DIR 置空走 toolchain 的 PATH 分支(本机才用显式锁定)
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Configure (PATH toolchain)
        # TOOLCHAIN_DIR= 走 toolchain 的 PATH 分支; CMAKE_MAKE_PROGRAM=ninja 覆盖
        # CMakePresets 里硬编码的本机 Windows ninja 路径(CI runner 找不到)
        run: cmake --preset Debug -DTOOLCHAIN_DIR= -DCMAKE_MAKE_PROGRAM=ninja

      - name: Build
        run: cmake --build build/Debug

      - name: Verify log/crash symbols in firmware
        run: |
          arm-none-eabi-nm build/Debug/AT32F421G8U7_WorkBench.elf | grep -E " (T|B) (log_write|log_init|g_hardfault|HardFault_Handler)$"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: build/Debug/AT32F421G8U7_WorkBench.elf
